
name: Auto Sync KAIRIX Fork

on:
  schedule:
    - cron: "*/2 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout my fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add original repository
        run: |
          git remote add upstream https://github.com/Aishwarya616-s/KAIRIX.git

      - name: Fetch original changes
        run: git fetch upstream main

      - name: Merge original changes
        run: git merge --no-edit upstream/main

      - name: Push updates to my fork
        run: git push origin main
